# Bearer tokens for services whose actuator endpoints are secured. Each key is
# exposed to the pod as an environment variable and referenced from the
# ConfigMap as ${KEY:}. Prefer creating this with `oc create secret` or your
# secrets manager rather than committing real values.
apiVersion: v1
kind: Secret
metadata:
  name: payment-health-dashboard-tokens
  labels:
    app: payment-health-dashboard
type: Opaque
stringData:
  CLIENT_DELIVERY_ACTUATOR_TOKEN: ""
